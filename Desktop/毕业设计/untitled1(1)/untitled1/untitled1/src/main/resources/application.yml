server:
  port: 8089
  tomcat:
    apr:
      enabled: false

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/canteen_recommendation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl.schema_management_tool: hibernate
        schema_management_tool.strip_definitions_before_export: true
        hbm2ddl.auto: update
  
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

# JWT配置
jwt:
  secret: canteenRecommendationSecretKey2024
  expiration: 86400000 # 24小时

# 文件上传配置
file:
  upload-dir: C:\Users\ASUS\Desktop\毕业设计\untitled1(1)\untitled1\untitled1\uploads

# 数据初始化配置
reset:
  dish:
    ids: false

# 日志配置
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.security: ERROR
    com.school.canteen: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
